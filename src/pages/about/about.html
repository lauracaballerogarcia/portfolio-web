<!--
  Plantilla de about.html: solo se usa el contenido del elemento main.
  main.js la importa con bundle-text: y copia ese contenido en el main
  de index.html, que es el único documento real. El título de la página
  lo pone el JS de la página; los metadatos comunes están en index.html.

  Esta plantilla solo tiene la estructura. El contenido (perfiles, foto,
  intro y secciones) vive en src/data/about.json y lo pinta about.js.
-->
<main>

    <h1 class="visually-hidden">About</h1>

    <!-- Selector de perfil: about.js lo rellena y lo muestra solo si
         hay más de un perfil con contenido -->
    <div class="about-profiles" id="about-profiles" role="group" aria-label="View profile" hidden></div>

    <!-- Rejilla de dos filas: foto e intro arriba; índice y secciones
         abajo, así el índice y la primera sección empiezan a la misma
         altura. El orden del DOM es el de lectura y el de móvil -->
    <div class="about-layout">
      <div class="about-media" id="about-image"></div>
      <div class="about-intro" id="about-intro"></div>
      <nav class="section-index about-index" id="about-index" aria-label="About sections"></nav>
      <div class="about-sections" id="about-sections"></div>
    </div>

  </main>
