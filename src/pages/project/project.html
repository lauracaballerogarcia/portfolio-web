<!--
  Plantilla de project.html: solo se usa el contenido del elemento main.
  main.js la importa con bundle-text: y copia ese contenido en el main
  de index.html, que es el único documento real. El título de la página
  lo pone el JS de la página; los metadatos comunes están en index.html.
-->
<main>

    <!-- Loading -->
    <div id="project-loading" aria-live="polite" aria-busy="true">
      <div class="container">
        <p>Loading...</p>
      </div>
    </div>

    <!-- Error -->
    <div id="project-error" hidden>
      <div class="container">
        <p role="alert">Project not found. <a href="/">Back to home</a></p>
      </div>
    </div>

    <!-- CONTENT -->
    <div id="project-content" hidden>

      <!-- Project Hero -->
      <div class="project-hero"></div>

      <!-- Layout principal -->
      <div class="project-layout">

        <!-- Sidebar: tile, client, tags, index -->
        <div class="project-sidebar">
          <div class="project-sidebar__sticky">
            <h1 id="project-title" class="project-sidebar__title"></h1>
            <p id="project-client" class="project-sidebar__client"></p>
            <div id="project-tags" class="project-sidebar__tags"></div>
            <nav class="section-index" aria-label="Project index"></nav>
          </div>
        </div>

        <!-- Main content: summary + metadata + case study -->
        <div class="project-main">

          <!-- Overview: summary + metadata (primera entrada del índice) -->
          <section id="overview" class="project-overview">
            <h2 class="visually-hidden">Overview</h2>

            <!-- summary -->
            <p id="project-summary" class="project-main__summary"></p>

            <!-- metadata -->
            <dl class="project-meta">
              <div class="project-meta__item">
                <dt class="project-meta__label">Timeline</dt>
                <dd id="project-timeline" class="project-meta__value"></dd>
              </div>
              <div class="project-meta__item">
                <dt class="project-meta__label">Roles</dt>
                <dd class="project-meta__value"><ul class="project-meta__list" id="project-role"></ul></dd>
              </div>
              <div class="project-meta__item">
                <dt class="project-meta__label">Team</dt>
                <dd class="project-meta__value"><ul class="project-meta__list" id="project-team"></ul></dd>
              </div>
              <div class="project-meta__item">
                <dt class="project-meta__label">Tools</dt>
                <dd class="project-meta__value"><ul class="project-meta__list" id="project-tools"></ul></dd>
              </div>
            </dl>
          </section>

          <!-- case study -->
          <article id="project-body" class="project-body cs-grid"></article>
        </div>
        
      </div>

      <aside class="related-work" aria-labelledby="related-work-title" hidden></aside>

      <!-- Volver arriba: por debajo de 1024px, tras pasar el índice (project.css, initBackToTop) -->
      <a href="#top" class="icon-button icon-button--outlined back-to-top"><span class="visually-hidden">Back to top</span></a>
    </div>

  </main>
